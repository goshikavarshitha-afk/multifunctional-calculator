<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1600"
    height="900"
    viewBox="0 0 1600 900"
>

    <defs>

        <linearGradient
            id="bg"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >

            <stop
                offset="0%"
                stop-color="#020617"
            />

            <stop
                offset="50%"
                stop-color="#0f172a"
            />

            <stop
                offset="100%"
                stop-color="#172554"
            />

        </linearGradient>


        <pattern
            id="grid"
            width="60"
            height="60"
            patternUnits="userSpaceOnUse"
        >

            <path
                d="M 60 0 L 0 0 0 60"
                fill="none"
                stroke="#334155"
                stroke-width="1"
                opacity="0.35"
            />

        </pattern>

    </defs>


    <rect
        width="1600"
        height="900"
        fill="url(#bg)"
    />


    <rect
        width="1600"
        height="900"
        fill="url(#grid)"
    />


    <circle
        cx="250"
        cy="180"
        r="170"
        fill="#2563eb"
        opacity="0.08"
    />


    <circle
        cx="1350"
        cy="700"
        r="250"
        fill="#7c3aed"
        opacity="0.08"
    />


    <circle
        cx="800"
        cy="450"
        r="300"
        fill="#0ea5e9"
        opacity="0.04"
    />

</svg>